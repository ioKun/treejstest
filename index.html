<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Палочный человечек — Three.js + Jolt MT</title>
    <script src="./coi-serviceworker.min.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="title">
        ПАЛОЧНЫЙ ЧЕЛОВЕЧЕК
        <span class="badge">JOLT&nbsp;MT</span>
      </div>
      <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ходить</span>
        <span><kbd>Shift</kbd> бег</span>
        <span><kbd>Space</kbd> прыжок</span>
        <span><kbd>ЛКМ</kbd> взять / бросить</span>
        <span><kbd>E</kbd> отпустить</span>
        <span><kbd>R</kbd> сброс</span>
      </div>
      <div class="mobile-tip">
        Джойстик — движение · полный наклон — бег · свайп — камера
      </div>
      <div id="stats"></div>
    </div>

    <div id="removed-counter">
      <div class="counter-label">УБРАНО</div>
      <div class="counter-value">
        <span id="removed-count">0</span>
        <span class="counter-separator">/</span>
        <span id="removed-total">1000</span>
      </div>
    </div>

    <div id="hint">Перетаскивай мышь — камера · Колесо — зум</div>

    <div id="touch-controls">
      <div id="move-pad" aria-label="Движение">
        <div id="move-stick"></div>
      </div>
      <div id="touch-actions">
        <button
          id="touch-jump"
          class="touch-button"
          type="button"
          aria-label="Прыжок"
        >
          <span class="touch-icon">↑</span>
          <span class="touch-label">ПРЫЖОК</span>
        </button>
        <button
          id="touch-reset"
          class="touch-button touch-button-secondary"
          type="button"
          aria-label="Сброс"
        >
          <span class="touch-icon">R</span>
          <span class="touch-label">СБРОС</span>
        </button>
      </div>
    </div>

    <div id="loader">
      <div class="spinner"></div>
      <div id="loader-text">Загрузка Jolt MT…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
